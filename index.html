<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Convite</title>
  <meta name="theme-color" content="#f4f6f8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="invite" id="invite">
    <div class="avatar" id="avatar">
      <img id="avatarImg" alt="">
      <span id="avatarFallback" aria-hidden="true"></span>
      <i class="online" aria-hidden="true"></i>
    </div>
    <h1 id="name"></h1>
    <p class="members" id="members"></p>
    <p class="desc" id="description"></p>
    <a class="btn" id="cta" href="#" target="_blank" rel="noopener noreferrer">
      <span>ENTRAR NO GRUPO</span>
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
    <p class="hint">Você será redirecionado para o Telegram.</p>
  </main>
  <p class="note">Página independente, não afiliada ao Telegram.</p>
  <script src="script.js"></script>
</body>
</html>
